[project]
name = "kt-agent"
version = "0.1.0"
description = "A local command-line knowledge-base agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kt-agent = "kt_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
